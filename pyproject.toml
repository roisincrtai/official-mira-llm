[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-llm"
version = "0.1.0"
description = "MIRA language model, mixer, and building blocks"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["default_config", "mirachat", "mira_llm"]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["model", "model.*", "kernel", "kernel.*", "helpers", "helpers.*", "muon", "muon.*", "tokenizer", "tokenizer.*", "tokenizer_sft", "tokenize_data", "pretrain", "instruct_sft", "tools", "config.default", "config.pretrain", "config.instruct_sft", "config.tokenizer_sft", "config.tokenize_data", "config.download"]
exclude = ["*.test", "*.tests", "*.__pycache__", "kernel.cuda.mamba*", "kernel.cuda.rwkv*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.cu", "*.cuh", "*.cpp", "*.h", "*.hpp", "*.metal", "Makefile", "*.mk", "*.yaml", "*.yml"]
"tokenizer" = ["cpp/*.cpp", "cpp/*.hpp", "cpp/Makefile"]

[tool.setuptools.exclude-package-data]
"tools" = ["config_wizard.py", "config_solver.py"]
